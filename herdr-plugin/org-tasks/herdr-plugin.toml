id = "cormacc.org-tasks"
name = "Org tasks"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Tab-local shared org-tasks terminal interface"
platforms = ["linux", "macos"]

[[panes]]
id = "tasks"
title = "Org tasks"
placement = "split"
command = ["bb", "--config", "bb.edn", "adapter.bb", "serve"]

[[actions]]
id = "open"
title = "Open compact task context"
command = ["bb", "--config", "bb.edn", "adapter.bb", "open"]

[[actions]]
id = "expand"
title = "Expand task browser"
command = ["bb", "--config", "bb.edn", "adapter.bb", "expand"]

[[actions]]
id = "collapse"
title = "Collapse task browser"
command = ["bb", "--config", "bb.edn", "adapter.bb", "collapse"]

[[actions]]
id = "close"
title = "Close owned task interface"
command = ["bb", "--config", "bb.edn", "adapter.bb", "close"]
