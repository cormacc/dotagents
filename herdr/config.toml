# Herdr config. dotfiles `agents.nix` links ~/.config/herdr/config.toml here with
# mkOutOfStoreSymlink, so edits take effect after `herdr server reload-config`
# without a Home Manager switch. Herdr can also write this file itself (for
# example `onboarding = false`); review such writes before you commit them.
onboarding = false

[ui]
agent_panel_sort = "spaces"

# Subscription quota for each herdr-orch provider. `oh` resolves its config from
# the active pane's working directory, so a project's herdr-orch config applies.
# The 75 s timeout exceeds the 60 s collection budget of `oh usage`.
# See plugins/herdr-orch/README.md. Set tab_bar_position = "bottom" for a footer.
tab_bar_right = [
  { type = "command", command = "~/.agents/skills/herdr-orch/scripts/oh usage --format status", interval_seconds = 60, timeout_seconds = 75 },
]

# Agents sidebar rows. The cormacc.herdr-orch plugin puts the agent-tree mark
# and the `<machine>:<workspace>:` prefix in the `agent` name
# (plugins/herdr-orch/README.md). An open client does not apply this stanza on
# `herdr server reload-config`.
[ui.sidebar.agents]
rows = [["state_icon", "agent", "$worktree"]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

# Next/previous agent in sidebar order; the cormacc.herdr-orch agent tree sets
# that order. Herdr 0.9.5 leaves both unbound, and its defaults already use
# prefix+j/k for pane focus, so these take the shifted letters.
[keys]
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"

# Open the herdr-orch quota pane. A keys.command cannot open a plugin pane
# directly, so a detached shell asks the CLI to open it.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin cormacc.herdr-orch --entrypoint quota"
description = "subscription quota"

# Display toggles use `prefix+ctrl+<letter>`: `t` for the sidebar agent tree and
# `o` for the org-tasks overlay. Avoid `prefix+ctrl+b` while the prefix is ctrl+b.
#
# org-tasks plugin controls. agents.nix registers the plugin; see
# plugins/org-tasks/README.md. The plugin reads these bindings to show
# key hints, so keep the command names.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "cormacc.org-tasks.select"
description = "select a task"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "cormacc.org-tasks.toggle"
description = "toggle org-tasks overlay"

# herdr-orch sidebar agent tree: global, persistent display toggle.
[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "cormacc.herdr-orch.tree-toggle"
description = "toggle the sidebar agent tree"
