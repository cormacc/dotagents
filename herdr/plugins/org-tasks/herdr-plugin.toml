id = "cormacc.org-tasks"
name = "Org tasks"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "One org-tasks compact pane that follows the focused tab"
platforms = ["linux", "macos"]

# One compact pane per session follows the focused tab while display is
# enabled. Its supervisor moves it on Herdr events; these hooks only reopen it
# when no live instance exists. A workspace switch also emits tab.focused.
# Closing the focused tab's last pane, the focused tab or the focused workspace
# moves focus with no tab.focused and ends the compact pane with that tab; each
# emits only pane.closed, tab.closed or workspace.closed, so those reopen it
# too. Every hook is idempotent, so none reads the event payload.
[[startup]]
command = ["bb", "--config", "bb.edn", "adapter.bb", "ensure"]

[[events]]
on = "tab.focused"
command = ["bb", "--config", "bb.edn", "adapter.bb", "ensure"]

[[events]]
on = "pane.closed"
command = ["bb", "--config", "bb.edn", "adapter.bb", "ensure"]

[[events]]
on = "tab.closed"
command = ["bb", "--config", "bb.edn", "adapter.bb", "ensure"]

[[events]]
on = "workspace.closed"
command = ["bb", "--config", "bb.edn", "adapter.bb", "ensure"]

[[panes]]
id = "tasks"
title = "Org tasks"
placement = "split"
command = ["bb", "--config", "bb.edn", "adapter.bb", "serve"]

# The browser runs in a popup: it takes all input, closes when `ot` exits on
# Esc, and Herdr then restores the earlier focus.
[[panes]]
id = "select"
title = "Select task"
placement = "popup"
width = "80%"
height = "80%"
command = ["bb", "--config", "bb.edn", "adapter.bb", "select-pane"]

[[actions]]
id = "select"
title = "Select a task from the backlog"
command = ["bb", "--config", "bb.edn", "adapter.bb", "select"]

[[actions]]
id = "toggle"
title = "Disable/enable org-tasks overlay"
command = ["bb", "--config", "bb.edn", "adapter.bb", "toggle"]
